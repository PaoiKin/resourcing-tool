<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resourcing & Timeline Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .timeline-grid {
            background-size: 48px 100%;
            background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px);
        }
        .modal-enter { animation: modalFadeIn 0.2s ease-out; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- CONFIGURATION ---
        // Use environment variables provided by the platform, with placeholders as fallback for external deployment
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
			const firebaseConfig = {
			  apiKey: "AIzaSyBzjzOAqnUv5cf6WG8tu8Z_WwQqyZq1vrk",
			  authDomain: "resourcing-tool-f24ee.firebaseapp.com",
			  projectId: "resourcing-tool-f24ee",
			  storageBucket: "resourcing-tool-f24ee.firebasestorage.app",
			  messagingSenderId: "132510268878",
			  appId: "1:132510268878:web:29d69ebe27808c3d213f9f",
			  measurementId: "G-7PXHJPVZ9R"
			};

        const appId = typeof __app_id !== 'undefined' ? __app_id : "my-company-resourcing-v1";

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Icons ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const paths = {
                plus: "M12 5v14M5 12h14",
                trash: "M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2",
                calendar: "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6c0-1.1.9-2 2-2z",
                userPlus: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M19 8v6M22 11h-6",
                chevronLeft: "M15 18l-6-6 6-6",
                chevronRight: "M9 18l6-6-6-6",
                layout: "M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z",
                user: "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
                x: "M18 6L6 18M6 6l12 12",
                logOut: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
                download: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",
                upload: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",
                briefcase: "M20 7h-3V5c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM9 5h6v2H9V5zm11 15H4V9h16v11z"
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d={paths[name]} />
                </svg>
            );
        };

        const formatDate = (date) => new Date(date).toISOString().split('T')[0];
        const isSameDay = (d1, d2) => 
            d1.getFullYear() === d2.getFullYear() &&
            d1.getMonth() === d2.getMonth() &&
            d1.getDate() === d2.getDate();

        const App = () => {
            const [userName, setUserName] = useState(() => sessionStorage.getItem('resourcing_user_name') || '');
            const [isLoggedIn, setIsLoggedIn] = useState(!!sessionStorage.getItem('resourcing_user_name'));
            const [loading, setLoading] = useState(true);
            const [authCompleted, setAuthCompleted] = useState(false);
            const [resources, setResources] = useState([]);
            const [activities, setActivities] = useState([]);
            const [projects, setProjects] = useState([]);
            const [viewDate, setViewDate] = useState(new Date());
            const [modals, setModals] = useState({ resource: false, activity: false, project: false });
            const fileInputRef = useRef(null);

            const [formData, setFormData] = useState({
                res: { name: '', role: '' },
                act: { resourceId: '', projectId: '', title: '', start: formatDate(new Date()), end: formatDate(new Date(Date.now() + 86400000 * 3)), color: 'bg-indigo-600' },
                prj: { name: '' }
            });

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                        setAuthCompleted(true);
                    } catch (error) {
                        console.error("Firebase auth error:", error);
                    } finally {
                        setLoading(false);
                    }
                };
                initAuth();
            }, []);

            useEffect(() => {
                if (!isLoggedIn || !authCompleted) return;
                
                const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const unsubRes = base.collection('resources').onSnapshot(
                    s => setResources(s.docs.map(d => ({ id: d.id, ...d.data() }))),
                    err => console.error("Firestore Resources error:", err)
                );
                
                const unsubAct = base.collection('activities').onSnapshot(
                    s => setActivities(s.docs.map(d => ({ id: d.id, ...d.data() }))),
                    err => console.error("Firestore Activities error:", err)
                );
                
                const unsubPrj = base.collection('projects').onSnapshot(
                    s => setProjects(s.docs.map(d => ({ id: d.id, ...d.data() }))),
                    err => console.error("Firestore Projects error:", err)
                );

                return () => { unsubRes(); unsubAct(); unsubPrj(); };
            }, [isLoggedIn, authCompleted]);

            const timelineDays = useMemo(() => {
                const start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
                const end = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0);
                start.setDate(start.getDate() - 7);
                end.setDate(end.getDate() + 14);
                const arr = [];
                for (let dt = new Date(start); dt <= new Date(end); dt.setDate(dt.getDate() + 1)) {
                    arr.push(new Date(dt));
                }
                return arr;
            }, [viewDate]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (userName.trim()) {
                    sessionStorage.setItem('resourcing_user_name', userName.trim());
                    setIsLoggedIn(true);
                }
            };

            const handleLogout = () => {
                sessionStorage.removeItem('resourcing_user_name');
                setUserName('');
                setIsLoggedIn(false);
            };

            const saveResource = async (e) => {
                e.preventDefault();
                if (!userName || !formData.res.name) return;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('resources').add({
                    ...formData.res, author: userName, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setFormData({ ...formData, res: { name: '', role: '' } });
                setModals({ ...modals, resource: false });
            };

            const saveProject = async (e) => {
                e.preventDefault();
                if (!userName || !formData.prj.name) return;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('projects').add({
                    ...formData.prj, author: userName, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setFormData({ ...formData, prj: { name: '' } });
            };

            const saveActivity = async (e) => {
                e.preventDefault();
                if (!userName || !formData.act.title || !formData.act.resourceId || !formData.act.projectId) return;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('activities').add({
                    ...formData.act, author: userName, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setModals({ ...modals, activity: false });
            };

            const removeResource = async (id) => {
                if (!confirm("Delete this person?")) return;
                const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
                await base.collection('resources').doc(id).delete();
                const related = activities.filter(a => a.resourceId === id);
                for (const a of related) {
                    await base.collection('activities').doc(a.id).delete();
                }
            };

            const removeProject = async (id) => {
                if (!confirm("Delete this project?")) return;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('projects').doc(id).delete();
            };

            if (loading) return (
                <div className="h-screen flex items-center justify-center bg-white font-bold text-slate-400">LOADING...</div>
            );

            if (!isLoggedIn) return (
                <div className="h-screen flex items-center justify-center bg-slate-50">
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 max-w-sm w-full text-center space-y-8">
                        <div className="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center text-white mx-auto shadow-xl"><Icon name="layout" size={40} /></div>
                        <div className="space-y-2">
                            <h1 className="text-2xl font-black text-slate-900">Resource Planner</h1>
                            <p className="text-slate-500 text-sm">Please enter your name to begin.</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input autoFocus required value={userName} onChange={e => setUserName(e.target.value)} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none font-medium text-slate-800" placeholder="Your Name" />
                            <button type="submit" className="w-full bg-slate-900 text-white font-bold py-4 px-6 rounded-2xl hover:bg-black transition-all shadow-lg">Enter Workspace</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 px-6 py-4">
                        <div className="max-w-screen-2xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><Icon name="layout" size={20} /></div>
                                <h1 className="text-lg font-bold text-slate-900 hidden sm:block">Resource Planner</h1>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setModals({...modals, project: true})} className="p-2 text-slate-400 hover:text-indigo-600"><Icon name="briefcase" size={20}/></button>
                                <button onClick={() => setModals({...modals, resource: true})} className="flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xs"><Icon name="userPlus" size={14} /> <span className="hidden md:inline">Add Person</span></button>
                                <button onClick={() => setModals({...modals, activity: true})} className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-bold text-xs shadow-md"><Icon name="plus" size={14} /> <span className="hidden md:inline">Plot Activity</span></button>
                                <button onClick={handleLogout} className="ml-2 p-2 text-slate-300 hover:text-red-500"><Icon name="logOut" size={18}/></button>
                            </div>
                        </div>
                    </header>
                    <main className="flex-1 p-6 max-w-screen-2xl mx-auto w-full">
                        <div className="flex items-center justify-between mb-8">
                            <div className="flex items-center gap-4">
                                <h2 className="text-2xl font-black text-slate-900">{viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2>
                                <div className="flex bg-white rounded-xl shadow-sm border border-slate-200 p-1">
                                    <button onClick={() => setViewDate(new Date(viewDate.setMonth(viewDate.getMonth() - 1)))} className="p-1.5 hover:bg-slate-50 rounded-lg"><Icon name="chevronLeft" /></button>
                                    <button onClick={() => setViewDate(new Date())} className="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Today</button>
                                    <button onClick={() => setViewDate(new Date(viewDate.setMonth(viewDate.getMonth() + 1)))} className="p-1.5 hover:bg-slate-50 rounded-lg"><Icon name="chevronRight" /></button>
                                </div>
                            </div>
                        </div>
                        <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden flex flex-col">
                            <div className="overflow-x-auto">
                                <div className="min-w-[1400px]">
                                    <div className="flex border-b border-slate-100 bg-slate-50/30">
                                        <div className="w-72 flex-shrink-0 p-5 border-r border-slate-100 font-black text-slate-400 text-[10px] uppercase tracking-[0.2em] bg-white sticky left-0 z-20">Team Capacity</div>
                                        <div className="flex flex-grow">
                                            {timelineDays.map((day, idx) => (
                                                <div key={idx} className={`w-12 flex-shrink-0 text-center py-4 border-r border-slate-50 flex flex-col items-center gap-1.5 ${day.getDay() === 0 || day.getDay() === 6 ? 'bg-slate-50/50' : ''} ${isSameDay(day, new Date()) ? 'bg-indigo-50/30' : ''}`}>
                                                    <span className="text-[10px] font-black text-slate-400 uppercase">{day.toLocaleDateString('en-US', { weekday: 'short' }).charAt(0)}</span>
                                                    <span className={`text-xs font-bold w-7 h-7 flex items-center justify-center rounded-xl ${isSameDay(day, new Date()) ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-700'}`}>{day.getDate()}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    {resources.length === 0 ? <div className="p-20 text-center text-slate-300 italic">No resources added.</div> : 
                                        resources.map(res => (
                                            <div key={res.id} className="flex border-b border-slate-50 group h-24">
                                                <div className="w-72 flex-shrink-0 p-5 border-r border-slate-100 bg-white sticky left-0 z-10 flex items-center justify-between group-hover:bg-slate-50">
                                                    <div className="flex items-center gap-4">
                                                        <div className="w-11 h-11 bg-slate-100 rounded-2xl flex items-center justify-center text-sm font-black border border-slate-200 text-slate-500">{res.name.charAt(0)}</div>
                                                        <div><div className="font-bold text-slate-900 text-sm">{res.name}</div><div className="text-[10px] text-slate-400 font-bold uppercase">{res.role}</div></div>
                                                    </div>
                                                    <button onClick={() => removeResource(res.id)} className="p-2 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><Icon name="trash" size={14}/></button>
                                                </div>
                                                <div className="flex flex-grow relative timeline-grid">
                                                    {timelineDays.map((day, idx) => (<div key={idx} className={`w-12 border-r border-slate-50/50 h-full ${day.getDay() === 0 || day.getDay() === 6 ? 'bg-slate-50/20' : ''}`}></div>))}
                                                    {activities.filter(a => a.resourceId === res.id).map(act => {
                                                        const startIdx = timelineDays.findIndex(d => isSameDay(d, new Date(act.start)));
                                                        const endIdx = timelineDays.findIndex(d => isSameDay(d, new Date(act.end)));
                                                        if (startIdx === -1 && endIdx === -1) return null;
                                                        const left = Math.max(0, startIdx) * 48;
                                                        const width = (Math.min(timelineDays.length - 1, endIdx) - Math.max(0, startIdx) + 1) * 48;
                                                        const project = projects.find(p => p.id === act.projectId);
                                                        return (
                                                            <div key={act.id} style={{ left: `${left}px`, width: `${width}px` }} className={`absolute top-6 h-12 rounded-xl ${act.color} border-2 border-white/20 shadow-md p-3 flex flex-col justify-center text-white group/item z-10`}>
                                                                <div className="flex justify-between items-center gap-2">
                                                                    <div className="truncate"><span className="text-[9px] font-black uppercase opacity-80 block">{project?.name}</span><span className="text-[10px] font-bold block">{act.title}</span></div>
                                                                    <button onClick={() => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('activities').doc(act.id).delete()} className="opacity-0 group-hover/item:opacity-100"><Icon name="x" size={12}/></button>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        </div>
                    </main>
                    {modals.resource && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm modal-enter p-8 space-y-6">
                                <h3 className="text-xl font-black text-slate-900">Add Person</h3>
                                <form onSubmit={saveResource} className="space-y-4">
                                    <input required value={formData.res.name} onChange={e => setFormData({...formData, res: {...formData.res, name: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none" placeholder="Full Name" />
                                    <input required value={formData.res.role} onChange={e => setFormData({...formData, res: {...formData.res, role: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none" placeholder="Role (e.g. Developer)" />
                                    <button className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Save Resource</button>
                                    <button type="button" onClick={() => setModals({...modals, resource: false})} className="w-full text-slate-400 font-bold">Cancel</button>
                                </form>
                            </div>
                        </div>
                    )}
                    {modals.project && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-md modal-enter p-8 space-y-6 flex flex-col max-h-[80vh]">
                                <h3 className="text-xl font-black text-slate-900">Projects</h3>
                                <form onSubmit={saveProject} className="flex gap-2"><input required value={formData.prj.name} onChange={e => setFormData({...formData, prj: { name: e.target.value}})} className="flex-1 bg-slate-50 rounded-xl px-4 py-3 outline-none" placeholder="New Project" /><button className="bg-slate-900 text-white px-4 rounded-xl"><Icon name="plus" size={18}/></button></form>
                                <div className="flex-1 overflow-y-auto space-y-2">
                                    {projects.map(p => (<div key={p.id} className="flex items-center justify-between p-4 bg-slate-50 rounded-xl group"><span className="font-bold text-slate-700">{p.name}</span><button onClick={() => removeProject(p.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="trash" size={16}/></button></div>))}
                                </div>
                                <button type="button" onClick={() => setModals({...modals, project: false})} className="w-full text-slate-400 font-bold">Close</button>
                            </div>
                        </div>
                    )}
                    {modals.activity && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm modal-enter p-8 space-y-6">
                                <h3 className="text-xl font-black text-slate-900">New Activity</h3>
                                <form onSubmit={saveActivity} className="space-y-4">
                                    <select required value={formData.act.resourceId} onChange={e => setFormData({...formData, act: {...formData.act, resourceId: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none">{resources.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}<option value="">Select Resource...</option></select>
                                    <select required value={formData.act.projectId} onChange={e => setFormData({...formData, act: {...formData.act, projectId: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none">{projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}<option value="">Select Project...</option></select>
                                    <input required value={formData.act.title} onChange={e => setFormData({...formData, act: {...formData.act, title: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none" placeholder="Activity Title" />
                                    <div className="grid grid-cols-2 gap-4"><input type="date" value={formData.act.start} onChange={e => setFormData({...formData, act: {...formData.act, start: e.target.value}})} className="bg-slate-50 rounded-2xl px-4 py-3 text-xs outline-none" /><input type="date" value={formData.act.end} onChange={e => setFormData({...formData, act: {...formData.act, end: e.target.value}})} className="bg-slate-50 rounded-2xl px-4 py-3 text-xs outline-none" /></div>
                                    <div className="flex justify-center gap-2 py-2">{['bg-blue-600', 'bg-indigo-600', 'bg-purple-600', 'bg-pink-600', 'bg-emerald-600'].map(c => (<button key={c} type="button" onClick={() => setFormData({...formData, act: {...formData.act, color: c}})} className={`w-8 h-8 rounded-xl ${c} ${formData.act.color === c ? 'ring-4 ring-slate-100 scale-110' : 'opacity-40'}`}></button>))}</div>
                                    <button className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl">Plot Activity</button>
                                    <button type="button" onClick={() => setModals({...modals, activity: false})} className="w-full text-slate-400 font-bold">Cancel</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
