<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resourcing & Timeline System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js" crossorigin></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js" crossorigin></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js" crossorigin></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .timeline-grid {
            background-size: 48px 100%;
            background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px);
        }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-enter { animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .sticky-col { position: sticky; left: 0; z-index: 20; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- Production Config ---
        const myProductionConfig = {
            apiKey: "AIzaSyBzjzOAqnUv5cf6WG8tu8Z_WwQqyZq1vrk",
            authDomain: "resourcing-tool-f24ee.firebaseapp.com",
            projectId: "resourcing-tool-f24ee",
            storageBucket: "resourcing-tool-f24ee.firebasestorage.app",
            messagingSenderId: "132510268878",
            appId: "1:132510268878:web:29d69ebe27808c3d213f9f",
            measurementId: "G-7PXHJPVZ9R"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config 
            ? JSON.parse(__firebase_config) 
            : myProductionConfig;

        const appId = typeof __app_id !== 'undefined' ? __app_id : "resourcing-system-final";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.settings({ experimentalForceLongPolling: true });

        // --- Icon Component ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const paths = {
                plus: "M12 5v14M5 12h14",
                trash: "M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2",
                calendar: "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6c0-1.1.9-2 2-2z",
                userPlus: "M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M19 8v6M22 11h-6",
                chevronLeft: "M15 18l-6-6 6-6",
                chevronRight: "M9 18l6-6-6-6",
                chevronDown: "M6 9l6 6 6-6",
                chevronUp: "M18 15l-6-6-6 6",
                layout: "M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z",
                user: "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
                x: "M18 6L6 18M6 6l12 12",
                logOut: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
                briefcase: "M20 7h-3V5c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM9 5h6v2H9V5zm11 15H4V9h16v11z",
                tag: "M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7 7h.01",
                settings: "M12.22 2h-.44a2 2 0 0 0-2 2 2 2 0 0 1-2 2 2 2 0 0 0-2 2 2 2 0 0 1-2 2 2 2 0 0 0-2 2v.44a2 2 0 0 0 2 2 2 2 0 0 1 2 2 2 2 0 0 0 2 2 2 2 0 0 1 2 2 2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2 2 2 0 0 1 2-2 2 2 0 0 0 2-2 2 2 0 0 1 2-2 2 2 0 0 0 2-2v-.44a2 2 0 0 0-2-2 2 2 0 0 1-2-2 2 2 0 0 0-2-2 2 2 0 0 1-2-2 2 2 0 0 0-2-2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
                users: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
                search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d={paths[name] || ""} />
                </svg>
            );
        };

        const formatDate = (date) => new Date(date).toISOString().split('T')[0];
        const isSameDay = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();

        const App = () => {
            const [userName, setUserName] = useState(() => sessionStorage.getItem('res_user_name') || '');
            const [isLoggedIn, setIsLoggedIn] = useState(!!sessionStorage.getItem('res_user_name'));
            const [activeView, setActiveView] = useState('timeline');
            const [maintenanceTab, setMaintenanceTab] = useState('projects');
            
            const [loading, setLoading] = useState(true);
            const [authReady, setAuthReady] = useState(false);
            const [dbError, setDbError] = useState(null);
            
            // Filters and UI State
            const [searchTerm, setSearchTerm] = useState('');
            const [groupBy, setGroupBy] = useState('role'); // 'none', 'role'
            const [collapsedGroups, setCollapsedGroups] = useState(new Set());

            const [resources, setResources] = useState([]);
            const [activities, setActivities] = useState([]);
            const [projects, setProjects] = useState([]);
            const [roles, setRoles] = useState([]);
            const [viewDate, setViewDate] = useState(new Date());
            const [isPlotModalOpen, setIsPlotModalOpen] = useState(false);

            const [formData, setFormData] = useState({
                res: { name: '', roleId: '' },
                act: { resourceId: '', projectId: '', title: '', start: formatDate(new Date()), end: formatDate(new Date(Date.now() + 86400000 * 3)), color: 'bg-indigo-600' },
                prj: { name: '' },
                rol: { name: '' }
            });

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                        setAuthReady(true);
                    } catch (e) {
                        console.error("Auth error:", e);
                        setDbError("Auth failed. Check connection.");
                    } finally {
                        setLoading(false);
                    }
                };
                initAuth();
            }, []);

            useEffect(() => {
                if (!isLoggedIn || !authReady || !db) return;
                const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
                const unsubRes = base.collection('resources').onSnapshot(s => setResources(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => setDbError(e.message));
                const unsubAct = base.collection('activities').onSnapshot(s => setActivities(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubPrj = base.collection('projects').onSnapshot(s => setProjects(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubRol = base.collection('roles').onSnapshot(s => setRoles(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => { unsubRes(); unsubAct(); unsubPrj(); unsubRol(); };
            }, [isLoggedIn, authReady]);

            const timelineDays = useMemo(() => {
                const start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
                const end = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0);
                start.setDate(start.getDate() - 7); end.setDate(end.getDate() + 14);
                const arr = [];
                for (let dt = new Date(start); dt <= new Date(end); dt.setDate(dt.getDate() + 1)) arr.push(new Date(dt));
                return arr;
            }, [viewDate]);

            // Filtered and Grouped Resources
            const filteredResources = useMemo(() => {
                return resources.filter(res => 
                    res.name.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [resources, searchTerm]);

            const groupedResources = useMemo(() => {
                if (groupBy === 'none') return [{ id: 'all', name: 'All Resources', resources: filteredResources }];
                
                return roles.map(role => ({
                    id: role.id,
                    name: role.name,
                    resources: filteredResources.filter(res => res.roleId === role.id)
                })).filter(group => group.resources.length > 0);
            }, [roles, filteredResources, groupBy]);

            const toggleGroup = (groupId) => {
                const newCollapsed = new Set(collapsedGroups);
                if (newCollapsed.has(groupId)) newCollapsed.delete(groupId);
                else newCollapsed.add(groupId);
                setCollapsedGroups(newCollapsed);
            };

            const addData = async (col, data) => {
                try {
                    const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    await base.collection(col).add({ ...data, author: userName, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                } catch (e) { console.error(e); }
            };

            const deleteData = async (col, id) => {
                if (!confirm(`Are you sure you want to delete this ${col.slice(0,-1)}?`)) return;
                try {
                    const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
                    await base.collection(col).doc(id).delete();
                    if (col === 'resources') {
                        const related = activities.filter(a => a.resourceId === id);
                        for (const a of related) await base.collection('activities').doc(a.id).delete();
                    }
                } catch (e) { console.error(e); }
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-slate-300 tracking-widest animate-pulse uppercase">Syncing System...</div>;

            if (!isLoggedIn) return (
                <div className="h-screen flex items-center justify-center bg-slate-50 p-6">
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-100 max-w-sm w-full space-y-8 text-center">
                        <div className="w-20 h-20 bg-indigo-600 rounded-[2rem] flex items-center justify-center text-white mx-auto shadow-xl"><Icon name="layout" size={40} /></div>
                        <h1 className="text-2xl font-black text-slate-900 tracking-tight leading-tight">Project Resource Planner</h1>
                        <form onSubmit={(e) => { e.preventDefault(); if (userName.trim()) { sessionStorage.setItem('res_user_name', userName.trim()); setIsLoggedIn(true); } }} className="space-y-4">
                            <input autoFocus required value={userName} onChange={e => setUserName(e.target.value)} className="w-full bg-slate-50 rounded-2xl px-6 py-4 outline-none font-semibold text-center border-2 border-transparent focus:border-indigo-100 transition-all shadow-inner" placeholder="Enter Your Name" />
                            <button type="submit" className="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition-all shadow-lg">Enter Workspace</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 px-6 py-3">
                        <div className="max-w-[1920px] mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md shadow-indigo-100"><Icon name="layout" size={18} /></div>
                                    <h1 className="text-base font-black text-slate-900 hidden lg:block tracking-tight">RESOURCE SYSTEM</h1>
                                </div>
                                <nav className="flex bg-slate-100 p-1 rounded-xl">
                                    <button 
                                        onClick={() => setActiveView('timeline')}
                                        className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeView === 'timeline' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        Timeline
                                    </button>
                                    <button 
                                        onClick={() => setActiveView('maintenance')}
                                        className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeView === 'maintenance' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        Setup
                                    </button>
                                </nav>
                            </div>

                            <div className="flex items-center gap-4">
                                {activeView === 'timeline' && (
                                    <div className="flex items-center gap-2">
                                        <div className="relative group hidden sm:block">
                                            <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                            <input 
                                                value={searchTerm}
                                                onChange={e => setSearchTerm(e.target.value)}
                                                className="bg-slate-100 pl-9 pr-4 py-1.5 rounded-lg text-xs font-medium focus:ring-2 focus:ring-indigo-200 transition-all outline-none w-48 lg:w-64"
                                                placeholder="Search team members..."
                                            />
                                        </div>
                                        <button 
                                            onClick={() => setGroupBy(groupBy === 'role' ? 'none' : 'role')}
                                            className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${groupBy === 'role' ? 'bg-indigo-50 text-indigo-600 border border-indigo-100' : 'bg-slate-100 text-slate-500'}`}
                                        >
                                            Group by Role: {groupBy === 'role' ? 'ON' : 'OFF'}
                                        </button>
                                        <button 
                                            onClick={() => setIsPlotModalOpen(true)}
                                            className="px-4 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold text-xs shadow-sm flex items-center gap-2"
                                        >
                                            <Icon name="plus" size={14} /> Plot
                                        </button>
                                    </div>
                                )}
                                <div className="w-px h-6 bg-slate-200 hidden sm:block"></div>
                                <button onClick={() => { sessionStorage.removeItem('res_user_name'); setUserName(''); setIsLoggedIn(false); }} className="p-2 text-slate-300 hover:text-red-500 transition-colors"><Icon name="logOut" size={18}/></button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 p-6 max-w-[1920px] mx-auto w-full fade-in">
                        {activeView === 'timeline' ? (
                            <div className="space-y-6">
                                {/* Timeline Controls */}
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <h2 className="text-xl font-black text-slate-900">{viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2>
                                        <div className="flex bg-white rounded-xl shadow-sm border border-slate-200 p-1">
                                            <button onClick={() => setViewDate(new Date(viewDate.setMonth(viewDate.getMonth() - 1)))} className="p-1.5 hover:bg-slate-50 rounded-lg"><Icon name="chevronLeft" size={16} /></button>
                                            <button onClick={() => setViewDate(new Date())} className="px-3 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-indigo-600">Today</button>
                                            <button onClick={() => setViewDate(new Date(viewDate.setMonth(viewDate.getMonth() + 1)))} className="p-1.5 hover:bg-slate-50 rounded-lg"><Icon name="chevronRight" size={16} /></button>
                                        </div>
                                    </div>
                                    <div className="hidden md:flex items-center gap-4 text-[10px] font-bold text-slate-400 uppercase tracking-[0.1em]">
                                        <div className="flex items-center gap-1.5"><div className="w-2 h-2 bg-indigo-600 rounded-full"></div> Allocated</div>
                                        <div className="flex items-center gap-1.5"><div className="w-2 h-2 bg-slate-200 rounded-full"></div> Weekend</div>
                                    </div>
                                </div>

                                {/* Matrix */}
                                <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <div className="min-w-[1400px]">
                                            {/* Static Grid Header */}
                                            <div className="flex border-b border-slate-100 bg-slate-50/30 sticky top-0 z-30">
                                                <div className="w-72 flex-shrink-0 p-5 border-r border-slate-100 font-black text-slate-400 text-[10px] uppercase bg-slate-50 sticky left-0 z-40">Resource Matrix</div>
                                                <div className="flex flex-grow">
                                                    {timelineDays.map((day, idx) => (
                                                        <div key={idx} className={`w-12 flex-shrink-0 text-center py-3 border-r border-slate-50 flex flex-col items-center gap-1 ${day.getDay() === 0 || day.getDay() === 6 ? 'bg-slate-50/50' : ''} ${isSameDay(day, new Date()) ? 'bg-indigo-50/30' : ''}`}>
                                                            <span className="text-[10px] font-bold text-slate-300">{day.toLocaleDateString('en-US', { weekday: 'short' }).charAt(0)}</span>
                                                            <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-lg ${isSameDay(day, new Date()) ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-700'}`}>{day.getDate()}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Grouped Rows */}
                                            {groupedResources.length === 0 ? <div className="p-32 text-center text-slate-300 italic">No resources found matching your search.</div> : 
                                                groupedResources.map(group => (
                                                    <React.Fragment key={group.id}>
                                                        {/* Group Header Row */}
                                                        {groupBy !== 'none' && (
                                                            <div 
                                                                onClick={() => toggleGroup(group.id)}
                                                                className="flex border-b border-slate-100 bg-slate-50/50 cursor-pointer hover:bg-slate-100 transition-colors sticky z-10"
                                                                style={{ top: '65px' }}
                                                            >
                                                                <div className="w-72 flex-shrink-0 p-3 pl-5 border-r border-slate-100 bg-slate-50 sticky left-0 z-20 flex items-center justify-between">
                                                                    <div className="flex items-center gap-2">
                                                                        <Icon name={collapsedGroups.has(group.id) ? 'chevronRight' : 'chevronDown'} size={14} className="text-slate-400" />
                                                                        <span className="text-xs font-black text-slate-600 uppercase tracking-widest">{group.name}</span>
                                                                    </div>
                                                                    <span className="px-2 py-0.5 bg-white text-[10px] font-black text-slate-400 rounded-lg border border-slate-200">{group.resources.length}</span>
                                                                </div>
                                                                <div className="flex-grow bg-slate-50/50"></div>
                                                            </div>
                                                        )}
                                                        
                                                        {/* Resource Rows */}
                                                        {!collapsedGroups.has(group.id) && group.resources.map(res => (
                                                            <div key={res.id} className="flex border-b border-slate-50 group h-20 hover:bg-slate-50/30 transition-colors">
                                                                <div className="w-72 flex-shrink-0 p-4 pl-8 border-r border-slate-100 bg-white sticky left-0 z-10 flex items-center justify-between group-hover:bg-slate-50 transition-colors">
                                                                    <div className="flex items-center gap-4">
                                                                        <div className="w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center text-xs font-black border border-slate-200 text-slate-500 uppercase">{res.name.charAt(0)}</div>
                                                                        <div className="truncate">
                                                                            <div className="font-bold text-slate-900 text-sm tracking-tight">{res.name}</div>
                                                                            <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{roles.find(r => r.id === res.roleId)?.name || 'Team Member'}</div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <div className="flex flex-grow relative timeline-grid">
                                                                    {timelineDays.map((day, idx) => (<div key={idx} className={`w-12 border-r border-slate-50/50 h-full ${day.getDay() === 0 || day.getDay() === 6 ? 'bg-slate-50/20' : ''}`}></div>))}
                                                                    {activities.filter(a => a.resourceId === res.id).map(act => {
                                                                        const startIdx = timelineDays.findIndex(d => isSameDay(d, new Date(act.start)));
                                                                        const endIdx = timelineDays.findIndex(d => isSameDay(d, new Date(act.end)));
                                                                        if (startIdx === -1 && endIdx === -1) return null;
                                                                        const left = Math.max(0, startIdx) * 48;
                                                                        const width = (Math.min(timelineDays.length - 1, endIdx) - Math.max(0, startIdx) + 1) * 48;
                                                                        const project = projects.find(p => p.id === act.projectId);
                                                                        return (
                                                                            <div key={act.id} style={{ left: `${left}px`, width: `${width}px` }} className={`absolute top-5 h-10 rounded-xl ${act.color || 'bg-indigo-600'} border-2 border-white/20 shadow-md p-2 px-3 flex flex-col justify-center text-white group/item z-10 hover:scale-[1.02] transition-transform cursor-default overflow-hidden`}>
                                                                                <div className="flex justify-between items-center gap-2">
                                                                                    <div className="truncate">
                                                                                        <span className="text-[8px] font-black uppercase opacity-70 block truncate tracking-tight leading-none mb-1">{project?.name || 'Project'}</span>
                                                                                        <span className="text-[10px] font-bold block truncate leading-none">{act.title}</span>
                                                                                    </div>
                                                                                    <button onClick={() => deleteData('activities', act.id)} className="opacity-0 group-hover/item:opacity-100 hover:scale-110 transition-opacity"><Icon name="x" size={10}/></button>
                                                                                </div>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </React.Fragment>
                                                ))
                                            }
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-5xl mx-auto space-y-8">
                                <div className="flex items-end gap-4">
                                    <div className="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm border border-indigo-100"><Icon name="settings" size={28} /></div>
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-900 tracking-tight leading-none">System Setup</h2>
                                        <p className="text-slate-400 text-xs font-bold uppercase tracking-[0.15em] mt-2">Administrative Controls</p>
                                    </div>
                                </div>

                                <div className="flex gap-4 border-b border-slate-200">
                                    {[
                                        { id: 'projects', label: 'Projects', icon: 'briefcase' },
                                        { id: 'roles', label: 'Roles', icon: 'tag' },
                                        { id: 'resources', label: 'Team Members', icon: 'users' }
                                    ].map(tab => (
                                        <button 
                                            key={tab.id}
                                            onClick={() => setMaintenanceTab(tab.id)}
                                            className={`flex items-center gap-2 pb-3 px-4 text-sm font-bold transition-all border-b-2 relative ${maintenanceTab === tab.id ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400 hover:text-slate-600'}`}
                                        >
                                            <Icon name={tab.icon} size={16} /> {tab.label}
                                            {maintenanceTab === tab.id && <div className="absolute bottom-[-2px] left-0 w-full h-[2px] bg-indigo-600 rounded-full shadow-[0_0_8px_rgba(79,70,229,0.4)]"></div>}
                                        </button>
                                    ))}
                                </div>

                                <div className="bg-white rounded-[2rem] border border-slate-200 shadow-xl overflow-hidden fade-in">
                                    <div className="p-8 bg-slate-50/50 border-b border-slate-100">
                                        {maintenanceTab === 'projects' && (
                                            <form onSubmit={(e) => { e.preventDefault(); addData('projects', formData.prj); setFormData({...formData, prj: {name:''}}); }} className="flex gap-3">
                                                <input required value={formData.prj.name} onChange={e => setFormData({...formData, prj: { name: e.target.value}})} className="flex-1 bg-white rounded-2xl px-6 py-4 outline-none font-semibold border border-slate-200 focus:border-indigo-100 focus:ring-4 focus:ring-indigo-50/50 transition-all shadow-sm" placeholder="Enter New Project Name..." />
                                                <button className="bg-slate-900 text-white px-8 rounded-2xl font-bold hover:bg-black transition-all flex items-center gap-2 shadow-lg"><Icon name="plus" size={18}/> Add Project</button>
                                            </form>
                                        )}
                                        {maintenanceTab === 'roles' && (
                                            <form onSubmit={(e) => { e.preventDefault(); addData('roles', formData.rol); setFormData({...formData, rol: {name:''}}); }} className="flex gap-3">
                                                <input required value={formData.rol.name} onChange={e => setFormData({...formData, rol: { name: e.target.value}})} className="flex-1 bg-white rounded-2xl px-6 py-4 outline-none font-semibold border border-slate-200 focus:border-indigo-100 focus:ring-4 focus:ring-indigo-50/50 transition-all shadow-sm" placeholder="Enter New Role Title..." />
                                                <button className="bg-slate-900 text-white px-8 rounded-2xl font-bold hover:bg-black transition-all flex items-center gap-2 shadow-lg"><Icon name="plus" size={18}/> Add Role</button>
                                            </form>
                                        )}
                                        {maintenanceTab === 'resources' && (
                                            <form onSubmit={(e) => { e.preventDefault(); addData('resources', formData.res); setFormData({...formData, res: {name:'', roleId:''}}); }} className="flex flex-col md:flex-row gap-3">
                                                <input required value={formData.res.name} onChange={e => setFormData({...formData, res: {...formData.res, name: e.target.value}})} className="flex-1 bg-white rounded-2xl px-6 py-4 outline-none font-semibold border border-slate-200 focus:border-indigo-100 shadow-sm" placeholder="Full Name" />
                                                <select required value={formData.res.roleId} onChange={e => setFormData({...formData, res: {...formData.res, roleId: e.target.value}})} className="flex-1 bg-white rounded-2xl px-6 py-4 outline-none font-semibold border border-slate-200 focus:border-indigo-100 shadow-sm">
                                                    <option value="">Choose Role...</option>
                                                    {roles.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                                </select>
                                                <button className="bg-slate-900 text-white px-8 rounded-2xl font-bold hover:bg-black transition-all flex items-center gap-2 shadow-lg justify-center"><Icon name="userPlus" size={18}/> Register Member</button>
                                            </form>
                                        )}
                                    </div>

                                    <div className="divide-y divide-slate-100 max-h-[600px] overflow-y-auto">
                                        {maintenanceTab === 'projects' && (projects.length === 0 ? <div className="p-20 text-center text-slate-300 italic">No project definitions.</div> :
                                            projects.map((p, i) => (
                                                <div key={p.id} className="flex items-center justify-between p-5 px-8 hover:bg-slate-50/50 transition-colors group">
                                                    <div className="flex items-center gap-4"><span className="text-slate-300 font-mono text-xs w-4">{(i+1).toString().padStart(2,'0')}</span><span className="font-bold text-slate-700 text-lg tracking-tight">{p.name}</span></div>
                                                    <button onClick={() => deleteData('projects', p.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-3 hover:bg-red-50 rounded-xl"><Icon name="trash" size={18}/></button>
                                                </div>
                                            ))
                                        )}
                                        {maintenanceTab === 'roles' && (roles.length === 0 ? <div className="p-20 text-center text-slate-300 italic">No roles defined.</div> :
                                            roles.map((r, i) => (
                                                <div key={r.id} className="flex items-center justify-between p-5 px-8 hover:bg-slate-50/50 transition-colors group">
                                                    <div className="flex items-center gap-4"><div className="w-2 h-2 rounded-full bg-indigo-400"></div><span className="font-bold text-slate-700 text-lg tracking-tight">{r.name}</span></div>
                                                    <button onClick={() => deleteData('roles', r.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-3 hover:bg-red-50 rounded-xl"><Icon name="trash" size={18}/></button>
                                                </div>
                                            ))
                                        )}
                                        {maintenanceTab === 'resources' && (resources.length === 0 ? <div className="p-20 text-center text-slate-300 italic">No team registered.</div> :
                                            resources.map(res => (
                                                <div key={res.id} className="flex items-center justify-between p-5 px-8 hover:bg-slate-50/50 transition-colors group">
                                                    <div className="flex items-center gap-6">
                                                        <div className="w-12 h-12 bg-white border border-slate-200 rounded-2xl flex items-center justify-center text-sm font-black text-indigo-600 shadow-sm">{res.name.charAt(0)}</div>
                                                        <div>
                                                            <p className="font-bold text-slate-800 text-lg leading-none mb-1">{res.name}</p>
                                                            <span className="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase tracking-widest rounded-md border border-indigo-100">{roles.find(r => r.id === res.roleId)?.name || 'Generic'}</span>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => deleteData('resources', res.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-3 hover:bg-red-50 rounded-xl"><Icon name="trash" size={18}/></button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modal: Plot Activity */}
                    {isPlotModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-sm modal-enter p-8 space-y-6">
                                <div className="flex justify-between items-center"><h3 className="text-xl font-black text-slate-900">Plot Activity</h3><button onClick={() => setIsPlotModalOpen(false)}><Icon name="x" className="text-slate-400 hover:text-slate-600"/></button></div>
                                <form onSubmit={(e) => { e.preventDefault(); addData('activities', formData.act); setIsPlotModalOpen(false); }} className="space-y-4 text-left">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block ml-1">Team Member</label>
                                        <select required value={formData.act.resourceId} onChange={e => setFormData({...formData, act: {...formData.act, resourceId: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none font-semibold border-2 border-transparent focus:border-indigo-100 transition-all appearance-none">
                                            <option value="">Select Resource...</option>
                                            {resources.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block ml-1">Assigned Project</label>
                                        <select required value={formData.act.projectId} onChange={e => setFormData({...formData, act: {...formData.act, projectId: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none font-semibold border-2 border-transparent focus:border-indigo-100 transition-all appearance-none">
                                            <option value="">Select Project...</option>
                                            {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block ml-1">Task Title</label>
                                        <input required value={formData.act.title} onChange={e => setFormData({...formData, act: {...formData.act, title: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-5 py-4 outline-none font-semibold border-2 border-transparent focus:border-indigo-100 transition-all shadow-sm" placeholder="e.g. Logic Development" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block ml-1">Start</label>
                                            <input type="date" value={formData.act.start} onChange={e => setFormData({...formData, act: {...formData.act, start: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-4 py-3 text-xs font-bold outline-none border-2 border-transparent focus:border-indigo-100 transition-all" />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block ml-1">End</label>
                                            <input type="date" value={formData.act.end} onChange={e => setFormData({...formData, act: {...formData.act, end: e.target.value}})} className="w-full bg-slate-50 rounded-2xl px-4 py-3 text-xs font-bold outline-none border-2 border-transparent focus:border-indigo-100 transition-all" />
                                        </div>
                                    </div>
                                    <div className="flex justify-center gap-2.5 py-2">
                                        {['bg-blue-600', 'bg-indigo-600', 'bg-purple-600', 'bg-pink-600', 'bg-emerald-600', 'bg-amber-500'].map(c => (<button key={c} type="button" onClick={() => setFormData({...formData, act: {...formData.act, color: c}})} className={`w-8 h-8 rounded-xl ${c} transition-all ${formData.act.color === c ? 'ring-4 ring-slate-100 scale-110 shadow-md' : 'opacity-40 hover:opacity-70'}`}></button>))}
                                    </div>
                                    <button className="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">Plot on Timeline</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
